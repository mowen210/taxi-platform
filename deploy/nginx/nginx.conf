# 出租汽车运营监管平台 - Nginx 反向代理
# 作用：统一入口、收敛跨域、透传 traceId、WebSocket 升级、前端静态托管占位

upstream taxi_backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # 前端管理端（Vue3 构建产物挂载到 /usr/share/nginx/html 后启用）
    root /usr/share/nginx/html;
    index index.html;

    # 追踪号透传：上游已有时复用，没有则由后端生成
    proxy_set_header X-Trace-Id $http_x_trace_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://taxi_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket：报警推送与地图点位
    location /ws/ {
        proxy_pass http://taxi_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 接口文档（生产建议关闭或加 IP 白名单）
    location /swagger-ui/ {
        proxy_pass http://taxi_backend;
    }
    location /v3/api-docs {
        proxy_pass http://taxi_backend;
    }

    # 前端单页应用路由回退
    location = / {
        return 302 /login;
    }

    # 独立登录页、管理首页与基础信息设置页
    location ~ ^/(login|admin|base)/?$ {
        proxy_pass http://taxi_backend;
    }

    # 内置页面由 Spring Boot 提供
    location ~ ^/(login|admin|base|monitor|alarm|dashboard|driver)\.html$ {
        proxy_pass http://taxi_backend;
    }
    location ~ ^/(base|monitor)\.(css|js)$ {
        proxy_pass http://taxi_backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;
}
