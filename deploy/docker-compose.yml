# =====================================================================
# 阶段 1~10 部署编排：MySQL8 + Redis7 + TDengine + 应用 + Nginx
# 唯一配置：cp config/taxi.env.example config/taxi.env 并修改
# 启动：mvn -DskipTests package
#       docker compose -f deploy/docker-compose.yml --env-file config/taxi.env up -d
# =====================================================================
services:
  mysql:
    image: mysql:8.0.36
    container_name: taxi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-taxi_platform}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=1000
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    container_name: taxi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  tdengine:
    image: tdengine/tdengine:3.3.0.0
    container_name: taxi-tdengine
    restart: unless-stopped
    environment:
      TAOS_FQDN: tdengine
    ports:
      - "6030:6030"
      - "6041:6041"
    volumes:
      - tdengine-data:/var/lib/taos
      - ./tdengine:/docker-entrypoint-initdb.d:ro
    profiles: ["track"]

  app:
    image: eclipse-temurin:17-jre
    container_name: taxi-app
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../config/taxi.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["java", "-XX:MaxRAMPercentage=70", "-Duser.timezone=Asia/Shanghai", "-jar", "/app/taxi-platform.jar"]
    volumes:
      - ../taxi-api/target/taxi-platform.jar:/app/taxi-platform.jar:ro
      - ../config:/app/config:ro
      - app-logs:/app/logs
      - media-data:/app/media
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "${PROTOCOL_PORT:-7611}:7611"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: taxi-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  redis-data:
  tdengine-data:
  app-logs:
  media-data:
